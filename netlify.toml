# Static site — no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

# inquiry.elyonedge.org is ElyonEdge's own landing page, so the root URL
# serves it directly. status = 200 rewrites without changing the address bar;
# force = true makes this win over any index.html sitting at the root.
# The directory of all client pages stays reachable at /clients/.
[[redirects]]
  from = "/"
  to = "/clients/elyonedge-marketing-sales/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
